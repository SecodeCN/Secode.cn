            musicToggle.addEventListener('click', () => {

                    bgMusic.pause();

        // 记录用户点击"再考虑"的次数

        // 获取随机情话
        function getRandomMessage() {
            const randomIndex = Math.floor(Math.random() * loveMessages.length);
            return loveMessages[randomIndex];
        }

        // 获取备用情话
        function getBackupMessage() {
            // 如果点击次数小于备用情话数量，按顺序显示
            if (noButtonClickCount < backupLoveMessages.length) {
                return backupLoveMessages[noButtonClickCount];
            }
            // 否则随机显示
            const randomIndex = Math.floor(Math.random() * backupLoveMessages.length);
            return backupLoveMessages[randomIndex];
        }

        // 创建花瓣
        function createPetal() {
            const petal = document.createElement('div');
            petal.className = 'flower-petal';

            // 随机样式 - 以玫瑰红为主
            const colors = ['#FF0033', '#FF335C', '#FF6684', '#FF99AD', '#FFB6C1'];
            const size = Math.random() * 10 + 10;
            const color = colors[Math.floor(Math.random() * colors.length)];

            petal.style.width = `${size}px`;
            petal.style.height = `${size}px`;
            petal.style.background = color;
            petal.style.left = `${Math.random() * 100}vw`;
            petal.style.opacity = Math.random() * 0.5 + 0.5;
            petal.style.animationDuration = `${Math.random() * 5 + 5}s`;
            petal.style.animationDelay = `${Math.random() * 5}s`;

            document.getElementById('petals-container').appendChild(petal);

            // 动画结束后移除花瓣
            setTimeout(() => {
                petal.remove();
            }, 10000);
        }

        // 创建爱心
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';

            // 随机样式
            const size = Math.random() * 10 + 10;
            const opacity = Math.random() * 0.5 + 0.5;

            heart.style.width = `${size}px`;
            heart.style.height = `${size}px`;
            heart.style.left = `${Math.random() * 100}vw`;
            heart.style.opacity = opacity;
            heart.style.animationDuration = `${Math.random() * 5 + 5}s`;
            heart.style.animationDelay = `${Math.random() * 5}s`;

            // 随机颜色渐变
            const colors = ['#FF0033', '#FF335C', '#FF6684'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            heart.style.backgroundColor = color;

            const before = heart.querySelector(':before');
            const after = heart.querySelector(':after');
            before.style.backgroundColor = color;
            after.style.backgroundColor = color;

            document.getElementById('petals-container').appendChild(heart);

            // 动画结束后移除爱心
            setTimeout(() => {
                heart.remove();
            }, 10000);

        // 初始化飘落效果

            // 初始创建一些花瓣和爱心
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    if (Math.random() > 0.7) {
                        createHeart();
                    } else {
                        createPetal();
                    }
                }, i * 200);
            }

            // 定时创建新的花瓣和爱心
            setInterval(() => {
                if (Math.random() > 0.7) {
                    createHeart();
                } else {
                    createPetal();
                }
            }, 500);
        }

        // 显示情话
        function displayMessage(message) {
            const messageElement = document.getElementById('love-message');

            // 先淡出当前消息
            messageElement.style.opacity = '0';

            setTimeout(() => {
                // 更换消息内容
                messageElement.textContent = message;

                // 添加打字效果
                let i = 0;
                messageElement.textContent = '';

                const typingEffect = setInterval(() => {
                    if (i < message.length) {
                        messageElement.textContent += message.charAt(i);
                        i++;
                    } else {
                        clearInterval(typingEffect);
                    }
                }, 50);

                // 淡入新消息
                setTimeout(() => {
                    messageElement.style.opacity = '1';
                }, 100);
            }, 300);
        }
