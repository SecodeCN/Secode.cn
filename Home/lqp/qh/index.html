<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <title>泉心全意，巧遇平生</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <canvas id="bg"></canvas>
    <div id="introOverlay" aria-label="进入动画" role="dialog">
        <div class="intro-inner">
            <div class="intro-heart">❤</div>
            <h2 class="intro-text">泉心全意，巧遇平生</h2>
        </div>
    </div>

    <div class="container">
        <h1 id="title" class="gradient-text">亲爱的巧平，</h1>
        <div id="typewriter"></div>

        <section class="timeline">
            <h2>我们的旅程</h2>
            <div class="steps" id="timelineSteps"></div>
        </section>

        <section class="reasons">
            <h2>我想和你共度一生的理由</h2>
            <ul id="reasonList"></ul>
        </section>

        <section class="proposal">
            <h2>你愿意嫁给我吗？💍</h2>
            <div class="actions">
                <button id="yesBtn" class="btn primary">我愿意</button>
                <button id="thinkBtn" class="btn ghost">再想想</button>
            </div>
            <p id="feedback"></p>
        </section>

        <div class="audio-control" id="musicPanel" role="button" aria-label="播放或暂停音乐" title="点击播放/暂停">
            <div class="eq" aria-hidden="true">
                <span></span><span></span><span></span><span></span><span></span>
            </div>
            <audio id="bgm" src="MarryYou.mp3" preload="auto" autoplay loop></audio>
        </div>

        <footer>© 永远属于我们的此刻</footer>
    </div>

    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-hearts" id="modalHearts"></div>
            <div class="ring-wrap" aria-hidden="true">
                    <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
                        <defs>
                            <linearGradient id="gradRing" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0%" stop-color="#ffe5f6" />
                                <stop offset="45%" stop-color="#ffb7d8" />
                                <stop offset="80%" stop-color="#ffc34f" />
                            </linearGradient>
                            <linearGradient id="gradDiamond" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="#fff9f4" />
                                <stop offset="40%" stop-color="#ffe0fa" />
                                <stop offset="100%" stop-color="#ffd5b4" />
                            </linearGradient>
                        </defs>
                        <!-- 戒环 -->
                        <circle cx="60" cy="60" r="34" stroke-width="8" class="ring-outline" />
                        <!-- 钻石主体 -->
                        <g class="diamond" transform="translate(60 24)">
                            <polygon class="facet facet-top" points="0,-18 16,-6 0,0 -16,-6" />
                            <polygon class="facet facet-left" points="-16,-6 0,0 -6,14 -18,8" />
                            <polygon class="facet facet-right" points="16,-6 18,8 6,14 0,0" />
                            <polygon class="facet facet-bottom" points="-6,14 0,20 6,14 0,0" />
                        </g>
                        <!-- 闪光粒子 -->
                        <g class="sparkles">
                            <circle cx="38" cy="34" r="2" />
                            <circle cx="82" cy="30" r="1.8" />
                            <circle cx="72" cy="88" r="2.2" />
                            <circle cx="44" cy="90" r="1.6" />
                        </g>
                    </svg>
            </div>
            <h3>我们一起开启永远 ❤️</h3>
            <p>从这一刻起，我们一起写下新的篇章。</p>
            <div class="days-info">我们已经一起走过 <span id="daysTogether">0</span> 天</div>
            <button id="closeModal" class="btn primary tiny">拥抱未来</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
