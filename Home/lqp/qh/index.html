<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Will You Marry Me?</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<canvas id="bg"></canvas>

<div class="container">
  <h1 id="title" class="gradient-text">亲爱的巧平，</h1>
  <div id="typewriter"></div>

  <section class="timeline">
    <h2>我们的旅程</h2>
  <div class="steps" id="timelineSteps"></div>
  </section>

  <section class="reasons">
    <h2>我想和你共度一生的理由</h2>
  <ul id="reasonList"></ul>
  </section>

  <section class="proposal">
    <h2>你愿意嫁给我吗？💍</h2>
    <div class="actions">
      <button id="yesBtn" class="btn primary">我愿意</button>
      <button id="thinkBtn" class="btn ghost">再想想</button>
    </div>
    <p id="feedback"></p>
  </section>

  <div class="audio-control" id="musicPanel" role="button" aria-label="播放或暂停音乐" title="点击播放/暂停">
    <div class="eq" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <audio id="bgm" src="MarryYou.mp3" preload="auto" autoplay loop></audio>
  </div>

  <footer>© 永远属于我们的此刻</footer>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-content">
    <h3>谢谢你答应我 ❤️</h3>
    <p>从这一刻起，我们一起写下新的篇章。</p>
    <button id="closeModal" class="btn primary tiny">拥抱未来</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
